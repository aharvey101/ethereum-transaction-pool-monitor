[package]
name = "ethereum-transaction-pool-monitor"
version = "0.1.0"
edition = "2021"
default-run = "ethereum-transaction-pool-monitor"

[[bin]]
name = "ethereum-transaction-pool-monitor"
path = "src/main.rs"

[[bin]]
name = "enhanced_pool_scanner"
path = "src/bin/enhanced_pool_scanner.rs"

[[bin]]
name = "import_arboo_cache"
path = "src/bin/import_arboo_cache.rs"

[[bin]]
name = "graph_pool_fetcher"
path = "src/bin/graph_pool_fetcher.rs"

[[bin]]
name = "debug_abi_decoder"
path = "src/bin/debug_abi_decoder.rs"

[[bin]]
name = "test_mempool"
path = "src/bin/test_mempool.rs"

[[bin]]
name = "test_basic_rpc"
path = "src/bin/test_basic_rpc.rs"

[[bin]]
name = "block_dex_analyzer"
path = "src/bin/block_dex_analyzer.rs"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
url = "2.0"
alloy = { version = "0.7", features = ["provider-http", "rpc-types-eth", "signer-local", "sol-types"] }
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
futures = "0.3"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
lazy_static = "1.4"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"
indicatif = "0.17"
env_logger = "0.10"
rand = "0.8"
clap = { version = "4.0", features = ["derive"] }
