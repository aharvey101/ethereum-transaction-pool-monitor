[package]
name = "ethereum-transaction-pool-monitor"
version = "0.1.0"
edition = "2021"
default-run = "ethereum-transaction-pool-monitor"

[[bin]]
name = "ethereum-transaction-pool-monitor"
path = "src/main.rs"

[[bin]]
name = "test_pool_fetch"
path = "src/bin/test_pool_fetch.rs"

[[bin]]
name = "enhanced_pool_scanner"
path = "src/bin/enhanced_pool_scanner.rs"

[[bin]]
name = "test_parallel_scan"
path = "src/bin/test_parallel_scan.rs"

[[bin]]
name = "import_arboo_cache"
path = "src/bin/import_arboo_cache.rs"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
alloy = { version = "0.7", features = ["provider-http", "provider-ws", "rpc-types-eth", "signer-local", "pubsub"] }
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
futures = "0.3"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json"] }
lazy_static = "1.4"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1.3"
indicatif = "0.17"
env_logger = "0.10"
